<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#080c18">
<title>Exam Pro Academy</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#080c18;color:#e8eef8;height:100vh;overflow:hidden}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.95)}}
@keyframes fadein{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* SPLASH */
#splash{
  position:fixed;inset:0;background:#080c18;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;padding:32px;
  z-index:9999;
}
.ring{width:90px;height:90px;border-radius:50%;border:3px solid #1a2540;border-top-color:#3b6ef8;border-right-color:#3b6ef8;animation:spin 1s linear infinite;display:flex;align-items:center;justify-content:center;margin-bottom:24px}
#splash h1{font-size:1.4em;font-weight:800;margin-bottom:6px}
#splash .sub{font-size:.78em;color:#4a5980;margin-bottom:28px}
#status{font-size:.82em;color:#4a5980}

/* OFFLINE */
#offline{
  position:fixed;inset:0;background:#080c18;
  display:none;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;padding:32px;
  z-index:9998;animation:fadein .5s ease;
}
.off-dish{font-size:5em;margin-bottom:4px;animation:float 3s ease-in-out infinite;display:block}
.off-logo{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#0f1e45,#1a3080);border:2px solid #ef444430;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:2em;box-shadow:0 0 30px #ef444415}
.off-title{font-size:1.35em;font-weight:800;color:#ef4444;margin-bottom:4px}
.off-sub{font-size:.72em;color:#334155;letter-spacing:.08em;margin-bottom:12px}
.off-line{width:60px;height:2px;background:linear-gradient(90deg,transparent,#3b6ef8,transparent);margin:0 auto 20px}
.off-msg{font-size:.83em;color:#4a5980;line-height:1.8;margin-bottom:28px;max-width:260px}
.off-btn{background:linear-gradient(135deg,#1d4ed8,#3b6ef8);color:#fff;border:none;padding:14px 0;border-radius:14px;font-size:.88em;font-weight:600;width:100%;max-width:260px;cursor:pointer;box-shadow:0 4px 20px #3b6ef830;transition:transform .15s}
.off-btn:active{transform:scale(.97)}
.off-dots{margin-top:20px;display:flex;gap:6px;justify-content:center}
.off-dots span{width:6px;height:6px;border-radius:50%;background:#1e2d45;animation:pulse 1.5s ease infinite}
.off-dots span:nth-child(2){animation-delay:.2s}
.off-dots span:nth-child(3){animation-delay:.4s}

/* APP IFRAME */
#appframe{
  position:fixed;inset:0;
  width:100%;height:100%;
  border:none;
  background:#080c18;
  display:none;
  z-index:100;
}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="ring"><div style="font-size:2em">🎓</div></div>
  <h1>Exam Pro Academy</h1>
  <div class="sub">NTA LEVEL 4 · 5 · 6</div>
  <div id="status">Inapakua URL ya server...</div>
</div>

<!-- OFFLINE -->
<div id="offline">
  <span class="off-dish">📡</span>
  <div class="off-logo">🎓</div>
  <div class="off-title">Server Imezimwa</div>
  <div class="off-sub">EXAM PRO ACADEMY</div>
  <div class="off-line"></div>
  <div class="off-msg">
    Server haifanyi kazi saa hii.<br>
    Mwambie admin awashe server,<br>
    kisha jaribu tena.
  </div>
  <button class="off-btn" onclick="startApp()">🔄 Jaribu Tena</button>
  <div class="off-dots"><span></span><span></span><span></span></div>
</div>

<!-- APP -->
<iframe id="appframe"></iframe>

<script>
const RAW_URL = "https://raw.githubusercontent.com/mussasongoma660-cmd/Exam--pro-app/main/url.txt";
let currentUrl = null;
let checkTimer = null;

const splash  = document.getElementById('splash');
const offline = document.getElementById('offline');
const frame   = document.getElementById('appframe');

function setStatus(m){ document.getElementById('status').textContent = m; }
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

function showSplash(){
  splash.style.display  = 'flex';
  offline.style.display = 'none';
  frame.style.display   = 'none';
  frame.src = 'about:blank';
}

function showOffline(){
  splash.style.display  = 'none';
  offline.style.display = 'flex';
  frame.style.display   = 'none';
  frame.src = 'about:blank';
  if(checkTimer) clearTimeout(checkTimer);
}

function showApp(url){
  currentUrl = url;
  frame.src = url;
  frame.style.display = 'block';
  splash.style.display  = 'none';
  offline.style.display = 'none';

  // Angalia server kila sekunde 15 — ikizimwa rudi offline
  scheduleCheck(url);
}

function scheduleCheck(url){
  if(checkTimer) clearTimeout(checkTimer);
  checkTimer = setTimeout(async()=>{
    const alive = await pingUrl(url);
    if(!alive){
      showOffline();
    } else {
      scheduleCheck(url);
    }
  }, 15000);
}

async function pingUrl(url){
  try{
    // Tumia fetch na timeout ya sekunde 6
    const ctrl = new AbortController();
    const t = setTimeout(()=> ctrl.abort(), 6000);
    await fetch(url, {mode:'no-cors', cache:'no-store', signal: ctrl.signal});
    clearTimeout(t);
    return true;
  }catch(e){
    return false;
  }
}

async function startApp(){
  showSplash();
  setStatus('Inapakua URL ya server...');

  try{
    // Soma url.txt kutoka GitHub
    const res = await fetch(RAW_URL + '?t=' + Date.now(), {cache:'no-store'});
    if(!res.ok){
      setStatus('Server imezimwa...');
      await sleep(1200);
      showOffline();
      return;
    }

    const url = (await res.text()).trim();
    if(!url || !url.startsWith('https://')){
      setStatus('Server imezimwa...');
      await sleep(1200);
      showOffline();
      return;
    }

    setStatus('URL imepatikana ✓ Inaungana...');
    await sleep(500);

    // Ping URL kwanza — kama imekwisha onyesha offline
    setStatus('Inaangalia server...');
    const alive = await pingUrl(url);
    if(!alive){
      setStatus('Server imezimwa...');
      await sleep(1200);
      showOffline();
      return;
    }

    setStatus('Server ipo ✓ Inafungua...');
    await sleep(400);
    showApp(url);

  }catch(e){
    setStatus('Hitilafu ya mtandao');
    await sleep(1200);
    showOffline();
  }
}

window.addEventListener('load', startApp);
</script>
</body>
</html>
