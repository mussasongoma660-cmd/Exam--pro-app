<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#080c18">
<title>Exam Pro Academy</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#080c18;color:#e8eef8;height:100vh;overflow:hidden;display:flex;flex-direction:column}
#splash{position:fixed;inset:0;background:#080c18;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;transition:opacity .5s}
#splash.hide{opacity:0;pointer-events:none}
.ring{width:80px;height:80px;border-radius:50%;border:3px solid #1a2540;border-top-color:#3b6ef8;border-right-color:#3b6ef8;animation:spin 1s linear infinite;display:flex;align-items:center;justify-content:center;margin-bottom:24px}
.ring-inner{font-size:2em}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:1.4em;font-weight:800;margin-bottom:6px}
.sub{font-size:.78em;color:#4a5980;margin-bottom:32px}
#status{font-size:.82em;color:#4a5980;text-align:center;padding:0 32px}
#offline{display:none;position:fixed;inset:0;background:#080c18;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;z-index:999}
#offline.show{display:flex}
.off-icon{font-size:3.5em;margin-bottom:16px}
.off-title{font-size:1.2em;font-weight:800;color:#ef4444;margin-bottom:8px}
.off-msg{font-size:.83em;color:#4a5980;line-height:1.6;margin-bottom:24px;max-width:280px}
.btn{background:#1d4ed8;color:#fff;border:none;padding:13px 0;border-radius:12px;font-size:.88em;font-weight:600;width:100%;max-width:260px;cursor:pointer;margin-bottom:10px}
.btn2{background:#0d1525;color:#64748b;border:1px solid #1a2540;padding:11px 0;border-radius:12px;font-size:.82em;width:100%;max-width:260px;cursor:pointer}
#appwrap{display:none;flex-direction:column;flex:1}
#appwrap.show{display:flex}
.topbar{background:#080c18;border-bottom:1px solid #1a2540;padding:8px 14px;display:flex;align-items:center;gap:10px;min-height:42px}
.brand{font-weight:700;font-size:.85em;color:#93c5fd;flex:1}
.live{font-size:.68em;color:#10b981;background:#10b98115;border:1px solid #10b98130;padding:3px 9px;border-radius:20px}
iframe{flex:1;border:none;width:100%;background:#080c18}
.botbar{background:#080c18;border-top:1px solid #1a2540;padding:8px 12px;display:flex;gap:8px}
.bb{flex:1;background:#0d1525;border:1px solid #1a2540;color:#e8eef8;padding:10px 4px;border-radius:10px;font-size:.76em;font-weight:600;cursor:pointer}
.bb.p{background:#1d3a8a;border-color:#3b6ef8;color:#fff}
</style>
</head>
<body>

<div id="splash">
  <div class="ring"><div class="ring-inner">🎓</div></div>
  <h1>Exam Pro Academy</h1>
  <div class="sub">NTA LEVEL 4 · 5 · 6</div>
  <div id="status">Inapakua URL ya server...</div>
</div>

<div id="offline">
  <div class="off-icon">📡</div>
  <div class="off-title">Server Imezimwa</div>
  <div class="off-msg">Server ya Exam Pro Academy haifanyi kazi saa hii.<br><br>Mwambie admin awashe server, kisha jaribu tena.</div>
  <button class="btn" onclick="startApp()">🔄 Jaribu Tena</button>
  <button class="btn2" onclick="showLastUrl()">🔗 Jaribu URL ya Mwisho</button>
  <div id="last-url-info" style="margin-top:12px;font-size:.7em;color:#334155"></div>
</div>

<div id="appwrap">
  <div class="topbar">
    <span class="brand">🎓 Exam Pro Academy</span>
    <span class="live">● LIVE</span>
  </div>
  <iframe id="frame" src="about:blank" allow="camera;microphone;fullscreen"></iframe>
  <div class="botbar">
    <button class="bb" onclick="goHome()">🏠 Home</button>
    <button class="bb" onclick="goBack()">← Rudi</button>
    <button class="bb p" onclick="startApp()">🔄 Reload</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════
// URL YA GITHUB RAW — inabadilisha GITHUB_USER na GITHUB_REPO
// ═══════════════════════════════════════════════════
const GITHUB_USER = "mussasongoma660-cmd";
const GITHUB_REPO = "Exam--pro-app";
const RAW_URL = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/url.txt`;
// ═══════════════════════════════════════════════════

let currentUrl = null;

function setStatus(m){ document.getElementById('status').textContent = m; }

function showOffline(){
  document.getElementById('splash').classList.add('hide');
  document.getElementById('offline').classList.add('show');
  document.getElementById('appwrap').classList.remove('show');
}

function showApp(url){
  currentUrl = url;
  localStorage.setItem('last_url', url);
  document.getElementById('frame').src = url;
  setTimeout(()=>{
    document.getElementById('splash').classList.add('hide');
    document.getElementById('offline').classList.remove('show');
    document.getElementById('appwrap').classList.add('show');
  }, 600);
}

function showLastUrl(){
  const u = localStorage.getItem('last_url');
  if(u){
    document.getElementById('last-url-info').textContent = u;
    showApp(u);
  }
}

async function startApp(){
  // Reset UI
  document.getElementById('splash').classList.remove('hide');
  document.getElementById('splash').style.opacity = '1';
  document.getElementById('offline').classList.remove('show');
  document.getElementById('appwrap').classList.remove('show');

  setStatus('Inapakua URL ya server...');

  try {
    // Soma url.txt kutoka GitHub raw — cache busting
    const res = await fetch(RAW_URL + '?t=' + Date.now(), {
      cache: 'no-store'
    });

    if(!res.ok){
      setStatus('url.txt haijapatikani — server imezimwa?');
      await sleep(1500);
      showOffline();
      return;
    }

    const url = (await res.text()).trim();

    if(!url || !url.startsWith('https://')){
      setStatus('URL si sahihi — server imezimwa?');
      await sleep(1500);
      showOffline();
      return;
    }

    setStatus('URL imepatikana ✓ Inaunganisha...');
    await sleep(700);
    showApp(url);

  } catch(e) {
    // Jaribu URL ya mwisho iliyohifadhiwa
    const saved = localStorage.getItem('last_url');
    if(saved){
      setStatus('Inatumia URL iliyohifadhiwa...');
      await sleep(700);
      showApp(saved);
    } else {
      setStatus('Hitilafu ya mtandao');
      await sleep(1500);
      showOffline();
    }
  }
}

function goHome(){ if(currentUrl) document.getElementById('frame').src = currentUrl; }
function goBack(){ try{ document.getElementById('frame').contentWindow.history.back(); }catch(e){} }
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

window.addEventListener('load', startApp);
</script>
</body>
</html>
