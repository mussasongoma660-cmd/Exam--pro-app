<script>
const GITHUB_API_URL = "https://api.github.com/repos/mussasongoma660-cmd/Exam--pro-app/contents/url.txt";
const CHECK_INTERVAL = 15000;
const OFFLINE_RETRY  = 30;
const IFRAME_TIMEOUT = 45000;

const splash  = document.getElementById('splash');
const offline = document.getElementById('offline');
const appwrap = document.getElementById('appwrap');
const frame   = document.getElementById('frame');
const retryBtn= document.getElementById('retryBtn');
const retryCD = document.getElementById('retryCD');
const cdSec   = document.getElementById('cdSec');

let checkTimer=null, retryTimer=null, cdTimer=null, iframeWatcher=null, isBusy=false;
let currentUrl=null;

function setStatus(m){ document.getElementById('status').textContent=m; }
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

function clearAllTimers(){
  if(checkTimer)    clearInterval(checkTimer),    checkTimer=null;
  if(retryTimer)    clearTimeout(retryTimer),     retryTimer=null;
  if(cdTimer)       clearInterval(cdTimer),        cdTimer=null;
  if(iframeWatcher) clearTimeout(iframeWatcher),  iframeWatcher=null;
}

async function fetchUrlViaAPI(){
  const res = await fetch(GITHUB_API_URL, {
    cache: 'no-store',
    headers: {
      'Accept': 'application/vnd.github.v3+json',
      'X-Timestamp': Date.now().toString()
    },
    signal: AbortSignal.timeout ? AbortSignal.timeout(12000) : undefined
  });
  if(!res.ok) throw new Error('API_FAIL:'+res.status);
  const json = await res.json();
  const b64  = json.content.replace(/\n/g,'').trim();
  return atob(b64).trim();
}

function showOffline(){
  clearAllTimers();
  if(frame){ frame.src='about:blank'; frame.style.display='none'; }
  splash.style.display  = 'none';
  offline.style.display = 'flex';
  appwrap.style.display = 'none';
  if(retryBtn) retryBtn.disabled = false;
  isBusy = false;

  let sec = OFFLINE_RETRY;
  if(cdSec) cdSec.textContent = sec;
  if(retryCD) retryCD.style.display = 'block';
  cdTimer = setInterval(()=>{
    sec--;
    if(cdSec) cdSec.textContent = sec;
    if(sec <= 0){
      clearInterval(cdTimer); cdTimer=null;
      if(retryCD) retryCD.style.display='none';
      startApp();
    }
  }, 1000);
}

function showApp(url){
  clearAllTimers();
  currentUrl = url;
  if(retryCD) retryCD.style.display='none';

  let loaded = false;

  frame.onload = ()=>{
    try{ if(frame.contentWindow.location.href==='about:blank') return; }catch(e){}
    loaded = true;
    if(iframeWatcher){ clearTimeout(iframeWatcher); iframeWatcher=null; }
    frame.style.display = 'block';
    splash.style.display  = 'none';
    offline.style.display = 'none';
    appwrap.style.display = 'flex';
    isBusy = false;
    startLiveCheck();
  };

  iframeWatcher = setTimeout(()=>{
    if(!loaded){ frame.src='about:blank'; showOffline(); }
  }, IFRAME_TIMEOUT);

  frame.src = url;
}

function startLiveCheck(){
  if(checkTimer) clearInterval(checkTimer);
  let failCount = 0;
  const MAX_FAIL = 3;

  checkTimer = setInterval(async()=>{
    try{
      const txt = await fetchUrlViaAPI();
      if(!txt || txt==='offline' || !txt.startsWith('https://')){
        failCount++;
        if(failCount >= MAX_FAIL) showOffline();
      } else {
        failCount = 0;
        if(txt !== frame.src) showApp(txt);
      }
    }catch(e){
      failCount++;
      if(failCount >= MAX_FAIL) showOffline();
    }
  }, CHECK_INTERVAL);
}

async function startApp(){
  if(isBusy) return;
  isBusy = true;
  clearAllTimers();
  if(retryCD) retryCD.style.display='none';
  if(retryBtn) retryBtn.disabled=true;

  splash.style.display  = 'flex';
  offline.style.display = 'none';
  appwrap.style.display = 'none';
  if(frame){ frame.src='about:blank'; frame.style.display='none'; }

  setStatus('Inapakua URL ya server...');
  await sleep(300);

  try{
    const url = await fetchUrlViaAPI();

    if(!url || url==='offline' || !url.startsWith('https://')){
      setStatus('Server imezimwa...');
      await sleep(900);
      showOffline();
      return;
    }

    setStatus('Inafungua app...');
    await sleep(400);
    showApp(url);

  }catch(e){
    setStatus('Hakuna muunganiko...');
    await sleep(900);
    showOffline();
  }
}

function goHome(){ if(currentUrl) frame.src=currentUrl; }
function goBack(){ try{ frame.contentWindow.history.back(); }catch(e){} }

window.addEventListener('load', startApp);

window.addEventListener('popstate', ()=>{
  if(appwrap.style.display==='flex'){
    frame.src='about:blank';
    showOffline();
  }
});
    </script>
