<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#080c18">
<title>Exam Pro Academy</title>
<style>
/* ── RESET & BASE ─────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#080c18;color:#e8eef8}

/* ── ANIMATIONS ──────────────────────────────────── */
@keyframes spin      {to{transform:rotate(360deg)}}
@keyframes float     {0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes pulse     {0%,100%{opacity:1}50%{opacity:.3}}
@keyframes fadein    {from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer   {0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes glow      {0%,100%{box-shadow:0 0 20px #3b6ef820}50%{box-shadow:0 0 40px #3b6ef840}}
@keyframes twinkle   {0%,100%{opacity:.2;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
@keyframes orbit     {from{transform:rotate(0deg) translateX(38px) rotate(0deg)}
                      to  {transform:rotate(360deg) translateX(38px) rotate(-360deg)}}
@keyframes bgmove    {0%,100%{transform:translateY(0) translateX(0)}50%{transform:translateY(-30px) translateX(20px)}}
@keyframes scanline  {0%{transform:translateY(-100%)}100%{transform:translateY(100vh)}}
@keyframes ripple    {0%{transform:scale(0);opacity:.6}100%{transform:scale(4);opacity:0}}

/* ── STARS ───────────────────────────────────────── */
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.star{
  position:absolute;border-radius:50%;background:#fff;
  animation:twinkle var(--d,3s) ease-in-out infinite;
  animation-delay:var(--dl,0s);
}

/* ── SPLASH SCREEN ───────────────────────────────── */
#splash{
  position:fixed;inset:0;z-index:9999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:32px;
}
.splash-logo-wrap{
  width:100px;height:100px;position:relative;margin-bottom:28px;
  animation:glow 2s ease-in-out infinite;
}
.splash-ring{
  width:100px;height:100px;border-radius:50%;
  border:3px solid #0f1e3d;
  border-top-color:#3b6ef8;border-right-color:#60a5fa;
  animation:spin 1s linear infinite;
  position:absolute;inset:0;
}
.splash-inner{
  position:absolute;inset:8px;border-radius:50%;
  background:linear-gradient(135deg,#0d1b40,#1a3080);
  display:flex;align-items:center;justify-content:center;
  font-size:2.2em;border:1px solid #1e3a6e;
}
.orbit-dot{
  width:8px;height:8px;border-radius:50%;
  background:#3b6ef8;box-shadow:0 0 8px #3b6ef8;
  position:absolute;top:50%;left:50%;margin:-4px;
  animation:orbit 2s linear infinite;
}
#splash h1{
  font-size:1.5em;font-weight:800;margin-bottom:6px;
  background:linear-gradient(135deg,#e8eef8,#60a5fa);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
#splash .sub{font-size:.75em;color:#2a3a60;letter-spacing:.15em;margin-bottom:32px}
.splash-bar-wrap{width:200px;height:3px;background:#0f1e3d;border-radius:4px;overflow:hidden;margin-bottom:12px}
.splash-bar{
  height:100%;width:0%;border-radius:4px;
  background:linear-gradient(90deg,#1d4ed8,#3b6ef8,#60a5fa);
  background-size:200%;
  animation:shimmer 1.5s linear infinite;
  transition:width .3s ease;
}
#statusTxt{font-size:.78em;color:#2a3a60}

/* ── OFFLINE SCREEN ──────────────────────────────── */
#offline{
  position:fixed;inset:0;z-index:9998;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:32px;
  animation:fadein .6s ease;
}
.off-card{
  background:linear-gradient(145deg,#0c1428,#111827);
  border:1px solid #1e2d45;border-radius:24px;
  padding:36px 28px;max-width:300px;width:100%;
  box-shadow:0 20px 60px #00000060,0 0 0 1px #1e3a6e20;
  position:relative;overflow:hidden;
}
.off-card::before{
  content:'';position:absolute;top:-50%;left:-50%;
  width:200%;height:200%;
  background:radial-gradient(ellipse at center,#1d4ed810 0%,transparent 70%);
  animation:bgmove 8s ease-in-out infinite;
  pointer-events:none;
}
.off-card::after{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,#3b6ef840,transparent);
  pointer-events:none;
}
.scanline-wrap{position:absolute;inset:0;overflow:hidden;border-radius:24px;pointer-events:none}
.scanline-wrap::after{
  content:'';position:absolute;left:0;right:0;height:2px;
  background:linear-gradient(transparent,#3b6ef820,transparent);
  animation:scanline 4s linear infinite;
}
.signal-rings{position:relative;width:80px;height:80px;margin:0 auto 20px}
.signal-ring{
  position:absolute;border-radius:50%;
  border:1.5px solid #ef444420;
  animation:ripple 3s ease-out infinite;
}
.signal-ring:nth-child(1){inset:20px;animation-delay:0s}
.signal-ring:nth-child(2){inset:10px;animation-delay:.5s}
.signal-ring:nth-child(3){inset:0;animation-delay:1s}
.signal-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2em}
.off-logo{
  width:64px;height:64px;border-radius:50%;
  background:linear-gradient(135deg,#0f1e45,#1a3080);
  border:2px solid #ef444430;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 16px;font-size:1.8em;
  box-shadow:0 0 30px #ef444415;
}
.off-title{
  font-size:1.3em;font-weight:800;
  background:linear-gradient(135deg,#ef4444,#f87171);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:4px;
}
.off-sub{font-size:.68em;color:#1e2d45;letter-spacing:.15em;margin-bottom:14px}
.off-divider{
  width:100%;height:1px;
  background:linear-gradient(90deg,transparent,#1e3a6e,transparent);
  margin-bottom:16px;
}
.off-status-row{
  display:flex;align-items:center;gap:8px;
  background:#0a1020;border-radius:10px;
  padding:10px 14px;margin-bottom:16px;
  border:1px solid #0f1e3d;
}
.off-dot{
  width:8px;height:8px;border-radius:50%;
  background:#ef4444;flex-shrink:0;
  animation:pulse 1.5s ease infinite;
  box-shadow:0 0 8px #ef444480;
}
.off-status-text{font-size:.78em;color:#4a5980;text-align:left;line-height:1.5}
.off-msg{font-size:.8em;color:#2a3a60;line-height:1.9;margin-bottom:24px}
.off-msg strong{color:#4a6090}
.retry-wrap{position:relative;width:100%;max-width:240px;margin:0 auto}
.off-btn{
  background:linear-gradient(135deg,#1d4ed8,#3b6ef8);
  color:#fff;border:none;
  padding:15px 0;border-radius:14px;
  font-size:.9em;font-weight:700;
  width:100%;cursor:pointer;
  box-shadow:0 4px 24px #3b6ef830;
  transition:transform .15s,box-shadow .15s;
  position:relative;overflow:hidden;
  letter-spacing:.03em;
}
.off-btn::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,#ffffff15,transparent);
  pointer-events:none;
}
.off-btn:active{transform:scale(.97);box-shadow:0 2px 12px #3b6ef820}
.off-btn:disabled{opacity:.5;cursor:not-allowed}
.retry-cd{margin-top:12px;font-size:.72em;color:#1e2d45;display:none}
.retry-cd span{color:#3b6ef8}
.off-dots{margin-top:18px;display:flex;gap:6px;justify-content:center}
.off-dots i{
  width:6px;height:6px;border-radius:50%;
  background:#0f1e3d;
  animation:pulse 1.8s ease infinite;
}
.off-dots i:nth-child(2){animation-delay:.3s}
.off-dots i:nth-child(3){animation-delay:.6s}

/* ── APP IFRAME ──────────────────────────────────── */
#appframe{
  position:fixed;inset:0;width:100%;height:100%;
  border:none;background:#080c18;
  display:none;z-index:100;
}
</style>
</head>
<body>

<!-- Stars background -->
<div id="stars"></div>

<!-- ══ SPLASH ══════════════════════════════════════ -->
<div id="splash">
  <div class="splash-logo-wrap">
    <div class="splash-ring"></div>
    <div class="splash-inner">🎓</div>
    <div class="orbit-dot"></div>
  </div>
  <h1>Exam Pro Academy</h1>
  <div class="sub">NTA LEVEL 4 · 5 · 6</div>
  <div class="splash-bar-wrap">
    <div class="splash-bar" id="prog"></div>
  </div>
  <div id="statusTxt">Inapakua URL ya server...</div>
</div>

<!-- ══ OFFLINE SCREEN ══════════════════════════════ -->
<div id="offline">
  <div class="off-card">
    <div class="scanline-wrap"></div>

    <div class="signal-rings">
      <div class="signal-ring"></div>
      <div class="signal-ring"></div>
      <div class="signal-ring"></div>
      <div class="signal-icon">📡</div>
    </div>

    <div class="off-logo">🎓</div>
    <div class="off-title">Server Imezimwa</div>
    <div class="off-sub">EXAM PRO ACADEMY</div>
    <div class="off-divider"></div>

    <div class="off-status-row">
      <div class="off-dot"></div>
      <div class="off-status-text">
        Seva haifanyi kazi saa hii.<br>
        Itawashwa hivi karibuni.
      </div>
    </div>

    <div class="off-msg">
      Mwambie <strong>admin</strong> awashe server,<br>
      kisha bonyeza kitufe hapa chini.
    </div>

    <div class="retry-wrap">
      <button class="off-btn" id="retryBtn" onclick="startApp()">
        🔄 Jaribu Tena
      </button>
      <div class="retry-cd" id="retryCD">
        Inajaribu tena kwa sekunde <span id="cdSec">30</span>...
      </div>
    </div>

    <div class="off-dots"><i></i><i></i><i></i></div>
  </div>
</div>

<!-- ══ APP FRAME ════════════════════════════════════ -->
<iframe
  id="appframe"
  allow="fullscreen"
  referrerpolicy="no-referrer-when-downgrade">
</iframe>

<script>
/* ════════════════════════════════════════════════════
   EXAM PRO ACADEMY — index.html
   Mfumo: GitHub API → url.txt → iframe app

   JINSI INAVYOFANYA KAZI:
   1. gh_relay.py (Termux) inasasisha url.txt kwenye GitHub
      kila wakati URL ya tunnel (cloudflared/ngrok) inabadilika.
   2. index.html (APK/browser) inasoma url.txt kupitia GitHub API
      bila cache, kisha inafungua URL hiyo kwenye iframe.
   3. Ukizima server → gh_relay.py inaweka "offline" kwenye url.txt
      → APK inaonyesha offline screen haraka kabla ya Cloudflare error.
   ════════════════════════════════════════════════════ */

// ── CONFIG — badilisha hapa tu ────────────────────────
const GH_OWNER        = "mussasongoma660-cmd";
const GH_REPO         = "Exam--pro-app";
const GH_FILE         = "url.txt";
const CHECK_INTERVAL  = 15000;   // Angalia URL mpya kila ms 15,000 (sekunde 15)
const OFFLINE_RETRY   = 30;      // Auto-retry baada ya sekunde 30
const IFRAME_TIMEOUT  = 45000;   // Timeout ya iframe kupakia (ms)
const MAX_FAIL_COUNT  = 3;       // Fails mfululizo → onyesha offline
// ─────────────────────────────────────────────────────

// GitHub API URL — inajengwa kutoka CONFIG hapo juu
const GITHUB_API_URL =
  `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}`;

// ── DOM REFS ──────────────────────────────────────────
const $splash   = document.getElementById("splash");
const $offline  = document.getElementById("offline");
const $frame    = document.getElementById("appframe");
const $prog     = document.getElementById("prog");
const $retryBtn = document.getElementById("retryBtn");
const $retryCD  = document.getElementById("retryCD");
const $cdSec    = document.getElementById("cdSec");
const $status   = document.getElementById("statusTxt");

// ── STATE ─────────────────────────────────────────────
let _checkTimer    = null;
let _retryTimer    = null;
let _cdTimer       = null;
let _iframeTimer   = null;
let _busy          = false;
let _failCount     = 0;

// ── STAR GENERATOR ────────────────────────────────────
(function buildStars() {
  const c = document.getElementById("stars");
  for (let i = 0; i < 60; i++) {
    const s   = document.createElement("div");
    s.className = "star";
    const sz  = (Math.random() * 2 + 0.5).toFixed(1);
    s.style.cssText = [
      `width:${sz}px`, `height:${sz}px`,
      `top:${(Math.random() * 100).toFixed(2)}%`,
      `left:${(Math.random() * 100).toFixed(2)}%`,
      `--d:${(Math.random() * 4 + 2).toFixed(1)}s`,
      `--dl:${(Math.random() * 4).toFixed(1)}s`,
      `opacity:${(Math.random() * 0.3 + 0.05).toFixed(2)}`,
    ].join(";");
    c.appendChild(s);
  }
})();

// ── HELPERS ───────────────────────────────────────────
function setStatus(msg)   { $status.textContent = msg; }
function setProgress(pct) { $prog.style.width   = pct + "%"; }
function sleep(ms)        { return new Promise(r => setTimeout(r, ms)); }

function clearAllTimers() {
  if (_checkTimer)  { clearInterval(_checkTimer);  _checkTimer  = null; }
  if (_retryTimer)  { clearTimeout(_retryTimer);   _retryTimer  = null; }
  if (_cdTimer)     { clearInterval(_cdTimer);     _cdTimer     = null; }
  if (_iframeTimer) { clearTimeout(_iframeTimer);  _iframeTimer = null; }
}

// ── GITHUB API — soma url.txt bila cache ──────────────
async function fetchUrlFromGitHub() {
  const res = await fetch(GITHUB_API_URL, {
    cache: "no-store",
    headers: {
      "Accept":      "application/vnd.github.v3+json",
      "X-Timestamp": Date.now().toString(),   // zuia cache ya browser
    },
    signal: AbortSignal.timeout ? AbortSignal.timeout(12000) : undefined,
  });

  if (!res.ok) throw new Error("GH_API_FAIL:" + res.status);

  const json = await res.json();

  // GitHub API: content ni base64 na newlines — safisha na decode
  const b64     = (json.content || "").replace(/\n/g, "").trim();
  const decoded = atob(b64).trim();

  return decoded;
}

// ── ONLINE CHECK — kila sekunde 15 ───────────────────
function startLiveCheck() {
  if (_checkTimer) clearInterval(_checkTimer);
  _failCount = 0;

  _checkTimer = setInterval(async () => {
    try {
      const url = await fetchUrlFromGitHub();

      if (!url || url === "offline" || !url.startsWith("https://")) {
        // URL si sahihi — hesabu fail
        _failCount++;
        if (_failCount >= MAX_FAIL_COUNT) showOffline();
      } else {
        _failCount = 0;  // URL ni sawa — reset counter
        // URL imebadilika? (tunnel mpya) — pakia upya iframe
        if (url !== $frame.src) {
          showApp(url);
        }
      }
    } catch (_e) {
      _failCount++;
      if (_failCount >= MAX_FAIL_COUNT) showOffline();
    }
  }, CHECK_INTERVAL);
}

// ── SHOW OFFLINE ──────────────────────────────────────
function showOffline() {
  clearAllTimers();

  // Futa iframe haraka — isionyeshe content ya zamani
  $frame.src          = "about:blank";
  $frame.style.display = "none";
  $splash.style.display  = "none";
  $offline.style.display = "flex";
  $retryBtn.disabled     = false;
  _busy                  = false;

  // Countdown ya auto-retry
  let sec = OFFLINE_RETRY;
  $cdSec.textContent      = sec;
  $retryCD.style.display  = "block";

  _cdTimer = setInterval(() => {
    sec--;
    $cdSec.textContent = sec;
    if (sec <= 0) {
      clearInterval(_cdTimer);
      _cdTimer               = null;
      $retryCD.style.display = "none";
      startApp();
    }
  }, 1000);
}

// ── SHOW APP ──────────────────────────────────────────
function showApp(url) {
  clearAllTimers();
  $retryCD.style.display = "none";

  let _loaded = false;

  $frame.onload = () => {
    // Ignore about:blank load event
    try {
      if ($frame.contentWindow.location.href === "about:blank") return;
    } catch (_e) { /* cross-origin: endelea */ }

    _loaded = true;
    if (_iframeTimer) { clearTimeout(_iframeTimer); _iframeTimer = null; }

    $frame.style.display   = "block";
    $splash.style.display  = "none";
    $offline.style.display = "none";
    _busy                  = false;
    startLiveCheck();
  };

  // Timeout: kama iframe haijapakia ndani ya IFRAME_TIMEOUT → offline
  _iframeTimer = setTimeout(() => {
    if (!_loaded) {
      $frame.src = "about:blank";
      showOffline();
    }
  }, IFRAME_TIMEOUT);

  $frame.src = url;
}

// ── MAIN — pakua url.txt kisha anzisha app ────────────
async function startApp() {
  if (_busy) return;
  _busy = true;
  clearAllTimers();
  $retryCD.style.display = "none";
  $retryBtn.disabled     = true;

  // Onyesha splash
  $splash.style.display  = "flex";
  $offline.style.display = "none";
  $frame.style.display   = "none";
  $frame.src             = "about:blank";

  setStatus("Inapakua URL ya server...");
  setProgress(20);
  await sleep(300);

  try {
    setProgress(50);

    // Soma url.txt kutoka GitHub API (gh_relay.py inaisasisha)
    const url = await fetchUrlFromGitHub();

    setProgress(75);
    await sleep(200);
    setProgress(90);

    if (!url || url === "offline" || !url.startsWith("https://")) {
      // Server imezimwa
      setStatus("Server imezimwa...");
      setProgress(100);
      await sleep(900);
      showOffline();
      return;
    }

    setStatus("Inafungua app...");
    setProgress(100);
    await sleep(400);
    showApp(url);

  } catch (_e) {
    setStatus("Hakuna muunganiko...");
    setProgress(100);
    await sleep(900);
    showOffline();
  }
}

// ── BOOT ─────────────────────────────────────────────
window.addEventListener("load", startApp);

// Bonyeza nyuma kwenye browser → onyesha offline badala ya kufunga
window.addEventListener("popstate", () => {
  if ($frame.style.display === "block") {
    $frame.src = "about:blank";
    showOffline();
  }
});
</script>

<!--
═══════════════════════════════════════════════════════
  MWONGOZO WA MATUMIZI (Termux)
═══════════════════════════════════════════════════════

  HATUA 1 — Hifadhi repo ya GitHub:
    - Unda repo: https://github.com/new
    - Ongeza faili url.txt na neno "offline" ndani yake

  HATUA 2 — Weka CONFIG kwenye gh_relay.py:
    - Fungua gh_relay.py kwenye Termux
    - Weka: GH_USER, GH_REPO, GH_TOKEN
    - au: run python3 gh_relay.py → itakuuliza mara ya kwanza

  HATUA 3 — Weka CONFIG kwenye index.html hii:
    - GH_OWNER = "jina-lako-github"
    - GH_REPO  = "jina-la-repo"
    - GH_FILE  = "url.txt"   (usibadilishe)

  HATUA 4 — Anzisha server (Termux):
    python3 examPro_v5_COMPLETE_FINAL2.py
    → chagua X (Web Bot)
    → chagua cloudflared au ngrok
    → URL ya tunnel itaonekana (.public_url)

  HATUA 5 — Anzisha gh_relay (Termux — tab mpya):
    python3 gh_relay.py
    → inasoma .public_url na kuipakia GitHub
    → APK inasoma GitHub na kufungua iframe

  HATUA 6 — Fungua index.html kwenye APK/browser
    → Itasoma url.txt → ifungue app moja kwa moja

  KUZIMA VIZURI:
    → Bonyeza CTRL+C kwenye gh_relay.py
    → Inaweka "offline" kwenye url.txt
    → APK inaonyesha "Server Imezimwa" haraka

═══════════════════════════════════════════════════════
-->
</body>
</html>
